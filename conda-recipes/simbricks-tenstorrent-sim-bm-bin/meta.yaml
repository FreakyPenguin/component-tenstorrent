package:
  name: simbricks-tenstorrent-sim-bm-bin
  version: {{ simbricks_version }}

source:
  path: ../../

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make

  host:
    # Provides simbricks/**.h plus libparser.a / libpcie.a / libbase.a.
    # No boost here: unlike the NIC models this adapter does not link libnicbm.
    - simbricks-lib >=0.5.0

  run:
    # Co-built python packages from this repo; pinned to the same version.
    - simbricks-tenstorrent-sim-bm-py =={{ simbricks_version }}
    - simbricks-tenstorrent-sys-py =={{ simbricks_version }}

about:
  home: {{ homepage }}
  license: MIT
  license_family: MIT
  license_file: ../../LICENSE
  summary: SimBricks PCIe adapter for Tenstorrent's ttsim chip model.
  description: |
    Presents Tenstorrent's libttsim.so as a SimBricks PCIe device. The library
    itself is not bundled: the adapter dlopens whichever libttsim.so it is
    pointed at, so one binary serves every chip build (wh, bh, wh_x2, ...).
    Build it from https://github.com/tenstorrent/ttsim or use the binaries
    published on that project's releases page.
  dev_url: {{ github_org }}
